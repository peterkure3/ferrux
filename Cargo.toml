[workspace]
resolver = "2"
members = [
    "crates/ferrux-core",
    "crates/ferrux-pty",
    "crates/ferrux-term",
    "crates/ferrux-ipc",
    "crates/ferrux-daemon",
    "crates/ferrux-tui",
    "crates/ferrux-notify",
    "crates/ferrux-agent-detect",
    "crates/ferrux-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = "1.53.1"
toml = "1.1.3"
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
winrt-notification = "0.5.1"
vt100 = "0.16.2"

# Keep local incremental builds and workspace backtraces/PDBs, without
# generating full variable/type information for the dependency graph.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
panic = "unwind"
