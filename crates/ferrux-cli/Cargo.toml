[package]
name = "ferrux-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ferrux"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm.workspace = true
ferrux-core = { version = "0.1.0", path = "../ferrux-core" }
ferrux-ipc = { version = "0.1.0", path = "../ferrux-ipc" }
ferrux-tui = { version = "0.1.0", path = "../ferrux-tui" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "io-std", "time"] }

[dev-dependencies]
portable-pty.workspace = true
ferrux-term = { version = "0.1.0", path = "../ferrux-term" }
