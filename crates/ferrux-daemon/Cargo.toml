[package]
name = "ferrux-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
ferrux-agent-detect = { version = "0.1.0", path = "../ferrux-agent-detect" }
ferrux-core = { version = "0.1.0", path = "../ferrux-core" }
ferrux-ipc = { version = "0.1.0", path = "../ferrux-ipc" }
ferrux-notify = { version = "0.1.0", path = "../ferrux-notify" }
ferrux-pty = { version = "0.1.0", path = "../ferrux-pty" }
